name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run tests
        run: make test

      - name: Build release assets
        run: make release VERSION="${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/swift-tooling-${GITHUB_REF_NAME}.tar.gz" \
            "dist/swift-tooling-${GITHUB_REF_NAME}.tar.gz.sha256" \
            dist/setup-swift-tools.sh \
            dist/release-manifest.env \
            --generate-notes
