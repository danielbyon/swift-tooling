# SwiftLint 0.65.1 shared baseline. The exact tool version is pinned in
# toolchain.lock. Consumer overlays own included/excluded paths and project
# exceptions.

strict: true
allow_zero_lintable_files: false

only_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - discouraged_object_literal
  - prefer_asset_symbols
  - prohibited_interface_builder
  - block_based_kvo
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - fallthrough
  - fatal_error_message
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - invisible_character
  - notification_center_detachment
  - nsobject_prefer_isequal
  - return_value_from_void_function
  - unavailable_condition
  - unavailable_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - void_function_in_ternary
  - weak_delegate
  - class_delegate_protocol
  - cyclomatic_complexity
  - file_name
  - file_name_no_space
  - lower_acl_than_parent
  - non_overridable_class_declaration
  - static_over_final_class
  - blanket_disable_command
  - generic_type_name
  - identifier_name
  - inclusive_language
  - invalid_swiftlint_command
  - line_length
  - local_doc_comment
  - missing_docs
  - orphaned_doc_comment
  - superfluous_disable_command
  - todo
  - type_name
  - function_default_parameter_at_end
  - is_disjoint
  - joined_default_parameter
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - legacy_objc_type
  - legacy_random
  - legacy_swiftui_aspect_ratio
  - legacy_uigraphics_function
  - non_optional_string_data_conversion
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - superfluous_else
  - unneeded_escaping
  - unneeded_override
  - untyped_error_in_catch
  - unused_control_flow_label
  - unused_enumerated
  - unused_setter_value
  - variable_shadowing

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

blanket_disable_command:
  allowed_rules: []
  always_blanket_disable: []

discouraged_object_literal:
  image_literal: true
  color_literal: true

cyclomatic_complexity:
  warning: 10
  error: 10
  ignores_case_statements: true

file_name:
  excluded:
    - main.swift
    - LinuxMain.swift
  excluded_paths: []
  prefix_pattern: ""
  suffix_pattern: '\+.*'
  nested_type_separator: "."
  require_fully_qualified_names: false

file_name_no_space:
  excluded: []

force_unwrapping:
  ignored_literal_argument_functions: []

incompatible_concurrency_annotation:
  global_actors:
    - MainActor

invisible_character:
  additional_code_points: []

function_default_parameter_at_end:
  ignore_first_isolation_inheritance_parameter: true

generic_type_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 20
    error: 20
  excluded: []
  allowed_symbols: []

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 60
  excluded: []
  allowed_symbols: []
  additional_operators: []

implicitly_unwrapped_optional:
  mode: all_except_iboutlets

inclusive_language:
  additional_terms: []
  override_terms:
    - blacklist
    - master
    - slave
    - whitelist
  override_allowed_terms:
    - mastercard

line_length:
  warning: 140
  error: 140
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: false
  ignores_interpolated_strings: false
  ignores_multiline_strings: true
  ignores_regex_literals: true
  excluded_lines_patterns: []

missing_docs:
  warning:
    - open
    - public
  excludes_extensions: false
  excludes_inherited_types: false
  excludes_trivial_init: false
  evaluate_effective_access_control_level: true

legacy_objc_type:
  allowed_types: []

non_optional_string_data_conversion:
  include_variables: true

non_overridable_class_declaration:
  final_class_modifier: "final class"

type_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 60
  excluded: []
  allowed_symbols: []
  validate_protocols: true

todo:
  only:
    - TODO
    - FIXME

unneeded_override:
  affect_initializers: false
  excluded_methods: []

unowned_variable_capture:
  allow_explicit_unsafe_unowned: false

unused_declaration:
  include_public_and_open: false
  related_usrs_to_skip: []

unused_import:
  require_explicit_imports: true
  allowed_transitive_imports: []
  always_keep_imports: []

variable_shadowing:
  ignore_parameters: true
